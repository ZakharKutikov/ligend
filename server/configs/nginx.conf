# Nginx configuration for Ligend VPN
# TLS 1.3 termination + WebSocket proxy + cover website

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # TLS 1.3 only — maximum security, minimum fingerprint
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Let's Encrypt certificates
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security headers (look like a normal site)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # ═══════════════════════════════════════════════
    # WebSocket VPN tunnel — secret path
    # Change this to match ws_path in ligend.yaml
    # ═══════════════════════════════════════════════
    location /ws-change-me {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward auth headers
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Timestamp $http_x_timestamp;
        proxy_set_header X-Nonce $http_x_nonce;

        # Long timeouts for VPN tunnel
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Disable buffering for real-time data
        proxy_buffering off;
        proxy_cache off;
    }

    # ═══════════════════════════════════════════════
    # Cover website — all other requests
    # Serves a real website for DPI/active probing
    # ═══════════════════════════════════════════════
    location / {
        # Proxy to Go backend which serves cover site
        # (so invalid WebSocket HMAC also shows the site)
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static assets caching (makes it look more like a real site)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:8443;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Block common attack paths
    location ~ /\. {
        deny all;
    }
}
